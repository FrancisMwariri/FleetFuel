services:
  - type: web
    name: fleetfuel-api
    runtime: docker
    plan: free
    repo: https://github.com/FrancisMwariri/FleetFuel.git
    branch: main
    rootDir: .
    healthCheckPath: /ready
    envVars:
      - key: FLEETFUEL_ENVIRONMENT
        value: production
      - key: FLEETFUEL_ENABLE_DOCS
        value: "true"
      - key: FLEETFUEL_DATABASE_URL
        fromDatabase:
          name: fleetfuel-db
          property: connectionString
      - key: FLEETFUEL_JWT_SECRET
        generateValue: true
      - key: FLEETFUEL_CORS_ORIGINS
        value: '["https://fleetfuel-web.onrender.com"]'
      - key: FLEETFUEL_ATTACHMENT_DIRECTORY
        value: /tmp/fleetfuel-private-uploads
      - key: FLEETFUEL_BOOTSTRAP_ADMIN_EMAIL
        value: adminmanager@gmail.com
      - key: FLEETFUEL_BOOTSTRAP_ADMIN_PASSWORD
        generateValue: true
      - key: PYTHONUNBUFFERED
        value: "1"

  - type: web
    name: fleetfuel-web
    runtime: static
    rootDir: mobile
    buildCommand: git clone --depth 1 --branch stable https://github.com/flutter/flutter.git /tmp/flutter && export PATH="/tmp/flutter/bin:$PATH" && flutter config --no-analytics && flutter pub get && flutter build web --release --dart-define=MEDIFUEL_API_BASE_URL=https://fleetfuel-api.onrender.com/api/v1
    staticPublishPath: build/web

databases:
  - name: fleetfuel-db
    databaseName: fleetfuel
    user: fleetfuel
    plan: free
