services:
  - type: web
    name: fleetfuel-api
    runtime: docker
    plan: free
    repo: https://github.com/FrancisMwariri/FleetFuel.git
    branch: main
    rootDir: .
    healthCheckPath: /ready
    envVars:
      - key: FLEETFUEL_ENVIRONMENT
        value: production
      - key: FLEETFUEL_DATABASE_URL
        fromDatabase:
          name: fleetfuel-db
          property: connectionString
      - key: FLEETFUEL_JWT_SECRET
        generateValue: true
      - key: FLEETFUEL_ATTACHMENT_DIRECTORY
        value: /tmp/fleetfuel-private-uploads
      - key: PYTHONUNBUFFERED
        value: "1"

databases:
  - name: fleetfuel-db
    databaseName: fleetfuel
    user: fleetfuel
    plan: free
