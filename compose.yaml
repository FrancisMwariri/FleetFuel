services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: fleetfuel
      POSTGRES_USER: fleetfuel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleetfuel -d fleetfuel"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      FLEETFUEL_ENVIRONMENT: development
      FLEETFUEL_DATABASE_URL: postgresql+psycopg://fleetfuel:${POSTGRES_PASSWORD}@db:5432/fleetfuel
      FLEETFUEL_JWT_SECRET: ${FLEETFUEL_JWT_SECRET:?Set FLEETFUEL_JWT_SECRET in the environment}
      FLEETFUEL_CORS_ORIGINS: '["http://localhost:5000","http://127.0.0.1:5000"]'
      FLEETFUEL_ATTACHMENT_DIRECTORY: /app/private_uploads
      PORT: "8000"
    ports:
      - "8000:8000"
    volumes:
      - private_uploads:/app/private_uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  private_uploads: