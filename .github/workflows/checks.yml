name: Backend checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: fleetfuel
          POSTGRES_USER: fleetfuel
          POSTGRES_PASSWORD: fleetfuel-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fleetfuel -d fleetfuel"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      FLEETFUEL_ENVIRONMENT: test
      FLEETFUEL_DATABASE_URL: postgresql+psycopg://fleetfuel:fleetfuel-ci-password@localhost:5432/fleetfuel
      FLEETFUEL_TEST_DATABASE_URL: postgresql+psycopg://fleetfuel:fleetfuel-ci-password@localhost:5432/fleetfuel_test
      FLEETFUEL_JWT_SECRET: ci-only-secret-value-not-for-deployment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: PGPASSWORD=fleetfuel-ci-password psql -h localhost -U fleetfuel -d fleetfuel -c "CREATE DATABASE fleetfuel_test;"
      - run: ruff check .
      - run: alembic upgrade head
      - run: pytest -q
